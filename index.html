<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>baseballapp.Wasm</title>
    
    <!-- ⭐ 주의: 아래 '저장소이름' 부분을 기록원님의 실제 깃허브 저장소 이름으로 바꿔주세요! -->
    <base href="/baseball/" />
    
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="baseballapp.Wasm.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>
<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    
    <!-- 1. autostart="false" 를 추가해서 자동 실행을 막습니다. -->
    <script src="_framework/blazor.webassembly.w3qd1tpl0e.js" autostart="false"></script>
    
    <!-- 2. 무결성(암호) 검사를 무시하고 파일을 강제로 불러오는 코드를 추가합니다. -->
    <script>
        Blazor.start({
            loadBootResource: function (type, name, defaultUri, integrity) {
                return defaultUri;
            }
        });
    </script>
</body>
</html>
