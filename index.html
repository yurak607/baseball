<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>baseballapp</title>

    <base id="dynamic-base" href="./" />
    <script>
            // 현재 접속한 주소가 내 컴퓨터(localhost)가 아니라면 (즉, 깃허브 페이지라면) 자동으로 /baseball/ 적용!
            if (!window.location.hostname.includes('localhost') && !window.location.hostname.includes('127.0.0.1')) {
                document.getElementById('dynamic-base').href = '/baseball/';
            } else {
                document.getElementById('dynamic-base').href = './';
            }
    </script>

    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="baseballapp.Wasm.styles.css" rel="stylesheet" />
</head>
<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webassembly.w3qd1tpl0e.js"></script>
</body>
</html>
